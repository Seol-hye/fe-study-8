<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>

    <h1 id="likes">달식당 좋아요♡ <span id="count">0</span></h1>


    <script>
        /* 코딩 부분 */

        let cnt = 0;

        document.getElementById('likes').onclick = function() {
            cnt++;
            document.getElementById('count').innerHTML = cnt;
        };

    </script>
</body>

</html>
