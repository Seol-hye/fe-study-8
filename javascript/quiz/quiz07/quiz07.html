<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            border: 1px solid black;
        }

        .back-red {
            background-color: red;
        }

        .back-blue {
            background-color: blue;
        }
    </style>
</head>

<body>
    <div class="box"></div>
    <button onclick="changeColor()">배경색 바꾸기</button>

    <script>
        /* 코딩부분 */

        //const box = document.querySelector('.box');
        //const box = document.querySelectorAll('.box')[0];
        const box = document.getElementsByClassName('box')[0];

        function changeColor() {
            let answer = prompt("1 또는 2를 입력하세요. 1:빨간색 2:파란색");

            if (answer == 1) {
                console.log("1번 입력 빨간색으로 변경");
                // box.classList.add('back-red');
                // box.classList.remove('back-blue');
                box.setAttribute('class', 'box back-red');
                //document.querySelector('.box').style.backgroundColor = 'red';
            } else if (answer == 2) {
                console.log("2번 입력 파란색으로 변경");
                // box.classList.add('back-blue');
                // box.classList.remove('back-red');
                box.setAttribute('class', 'box back-blue');
                //document.querySelector('.box').style.backgroundColor = 'blue';
            } else {
                alert('잘못 입력했습니다...');
            }
        }

    </script>
</body>

</html>
