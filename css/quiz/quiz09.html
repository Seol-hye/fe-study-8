<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .container {
                background-color: lightgray;
                /* display: flex;
                flex-direction: column; */
            }

            .box {
                width: 100px;
                height: 100px;
                border: 1px solid black;
                transition-property: all;
                transition-duration: 1s;
            }

            .row {
                display: flex;
            }

            .redbox { background-color: red; }
            .bluebox { background-color: blue; }
            .blackbox { background-color: black; }
            .greenbox { background-color: green; }
            .orangebox { background-color: orange; }

            .container:hover .redbox {
                width: 400px;
                
            }

            .container:hover .bluebox {
                background-color: purple;
            }

            .container:hover .blackbox {
                transform: translateX(200px);
            }

            .greenbox:hover, .orangebox:hover {
                border: 10px solid red;
            }
        </style>
    </head>
    <body>

        <div class="container">
            <div class="box redbox"></div>
            <div class="box bluebox"></div>
            <div class="box blackbox"></div>
            <div class="row">
                <div class="box greenbox"></div>
                <div class="box orangebox"></div>
            </div>
        </div>
        
    </body>
</html>
