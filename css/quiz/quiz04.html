<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>

            * {
                margin: 0px;
                padding: 0px;
                box-sizing: border-box;
            }

            .back-lightgray {
                margin: 0px;
                background-color: lightgray;
            }

            .box { 
                width: 100px; 
                height: 100px;
            }
            
            .container {
                border: 4px solid black;
                width: 500px;
                height: 300px;
                margin: 50px;
            }

            .red-box {
                background-color: red;
            }

            .green-box {
                background-color: green;
                position: absolute;
                left: 100px;
                top: 150px;
            }

            .yellow-box {
                background-color: yellow;
            }
        </style>
    </head>
    <body>

        <div class="back-lightgray">
            <h3>배경색이 lightgray</h3>
            <h3>h3글자</h3>
        </div>

        <div class="container">
            <div class="box red-box">A</div>
            <div class="box green-box">B</div>
            <div class="box yellow-box">C</div>
        </div>

        <!-- <div>하단 다음에 추가될 내용</div> -->
        
    </body>
</html>
