<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            .container {
                width: 800px;
                height: 500px;
                margin: 0 auto;
                
            }

            .top, .middle, .bottom {
                display: flex;
            }


            .top-yellow {
                background-color: yellow;
                width: 50%;
                height: 100px;
            }

            .top-gray {
                background-color: gray;
                width: 50%;
                height: 100px;
            }

            .purple {
                background-color: purple;
                width: 100%;
                height: 100px;
            }

            .skyblue {
                background-color: skyblue;
                width: 300px;
                height: 200px;
            }
            

            .m-yellow {
                background-color: yellow;
                width: 500px;
                height: 100px;
            }

            .coral {
                background-color: coral;
                width: 500px;
                height: 100px;
            }

            .right {
                display: flex;
                flex-direction: column;
            }

            .b-yellow {
                background-color: yellow;
                width: 200px;
                height: 100px;
            }

            .b-orange {
                background-color: orange;
                width: 200px;
                height: 100px;
            }

            .b-green {
                background-color: greenyellow;
                width: 200px;
                height: 100px;
            }
        </style>
    </head>
    <body>

        <div class="container">

            <div class="top">
                <div class="top-yellow"></div>
                <div class="top-gray"></div>
            </div>

            <div class="purple"></div>

            <div class="middle">
                <div class="skyblue"></div>
                <div class="right">
                    <div class="m-yellow"></div>
                    <div class="coral"></div>
                </div>
            </div>

            <div class="bottom">
                <div class="b-yellow"></div>
                <div class="b-orange"></div>
                <div class="b-yellow"></div>
                <div class="b-green"></div>
            </div>

        </div>
        
    </body>
</html>
